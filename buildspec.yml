version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 20
    commands:
      - npm install -g aws-cdk
  build:
    commands:
      - cd backend && mvn clean package -B
      - cd ../infra && npm ci && npx cdk synth && npx cdk deploy --require-approval never

cache:
  paths:
    - '/root/.m2/**/*'
    - 'infra/node_modules/**/*'
